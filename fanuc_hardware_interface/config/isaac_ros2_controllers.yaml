/**:
  ros__parameters:
    update_rate: 500 # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    fanuc_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


/**/joint_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - "$(var prefix)J1"
      - "$(var prefix)J2"
      - "$(var prefix)J3"
      - "$(var prefix)J4"
      - "$(var prefix)J5"
      - "$(var prefix)J6"
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false # Set to false to suppress deprecation warning
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      $(var prefix)J1:
        goal: 0.05
        trajectory: 0.25
      $(var prefix)J2:
        goal: 0.05
        trajectory: 0.25
      $(var prefix)J3:
        goal: 0.05
        trajectory: 0.25
      $(var prefix)J4:
        goal: 0.05
        trajectory: 0.25
      $(var prefix)J5:
        goal: 0.05
        trajectory: 0.25
      $(var prefix)J6:
        goal: 0.05
        trajectory: 0.25

/**/fanuc_gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - "$(var prefix)finger_joint"
    command_interfaces:
      - position
    state_interfaces:
      - position
